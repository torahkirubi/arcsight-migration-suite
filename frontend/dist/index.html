<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"SF Mono"', 'Menlo', 'monospace'],

              800: '#161a26',

  <!-- React 18 & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    html { font-size: 16px; letter-spacing: -0.01em; }

      background-color: #07080b;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, sans-serif;

      letter-spacing: -0.01em;

    ::-webkit-scrollbar-track { background: transparent; }

</head>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Clean Lucide-React SVG Components (Strictly Zero Emojis) ---

    const ArrowRightIcon = ({ className = "w-4 h-4" }) => (

    );
    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );
    const ShieldCheckIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    );
    const AlertTriangleIcon = ({ className = "w-4 h-4" }) => (

    );
    const AlertCircleIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );
    const CopyIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    );
    const CheckIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    );
    const DownloadIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    );
    const XIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const UserCheckIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
    );
    const PlayIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    );
    const TerminalIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
    );
    const SearchIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    );

    const SAMPLE_ARCSIGHT_RULE = `Rule Name: ADFind Active Directory Reconnaissance Detected
Priority: 7
Matching 5 events in 10 Minutes
groupByFields: deviceHostName, destinationUserName

Conditions:
(attackerServiceName EQ "cmd.exe" And (deviceCustomString1 Contains "adfind.exe" Or deviceCustomString2 Contains "adfind.exe" And (destinationUserName NE "service_account" And (destinationPort NE "80"

Actions:
SetEventField(name, "ADFind Active Directory Reconnaissance Detected")
SetEventField(basePriority, 7)
SetEventField(eventAnnotationStage, <Resource URI="/All Stages/MITRE Tactics/Discovery" />)`;

    function App() {
      const [llmConfig, setLlmConfig] = useState({
        provider: 'lm_studio',
        model_name: 'qwen2.5-coder-7b-instruct',
        custom_base_url: 'http://localhost:1234/v1',
      });

      const [health, setHealth] = useState(null);
      const [isFetchingHealth, setIsFetchingHealth] = useState(false);

      const [rawText, setRawText] = useState(SAMPLE_ARCSIGHT_RULE);
      const [isTranslating, setIsTranslating] = useState(false);
      const [translationResult, setTranslationResult] = useState(null);
      const [translationError, setTranslationError] = useState(null);

      const [threatAnalysis, setThreatAnalysis] = useState(null);
      const [isGeneratingRunbook, setIsGeneratingRunbook] = useState(false);

      const [mdeCoverage, setMdeCoverage] = useState({
        verdict: '',
        notes: '',
        reviewer_name: 'Detection Engineer',
      });

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isAuditLogOpen, setIsAuditLogOpen] = useState(false);
      const [auditData, setAuditData] = useState(null);
      const [auditSearch, setAuditSearch] = useState('');
      const [isSplunkModalOpen, setIsSplunkModalOpen] = useState(false);
      const [splunkQuery, setSplunkQuery] = useState('');
      const [splunkRunning, setSplunkRunning] = useState(false);
      const [splunkResult, setSplunkResult] = useState(null);
      const [splunkError, setSplunkError] = useState(null);

      const [isExportOpen, setIsExportOpen] = useState(false);
      const [savedRunbook, setSavedRunbook] = useState(null);
      const [deepMode, setDeepMode] = useState(false);
      const [deepLogs, setDeepLogs] = useState([]);

      const [copiedKql, setCopiedKql] = useState(false);
      const [copiedSpl, setCopiedSpl] = useState(false);

      const pollHealth = async () => {
        setIsFetchingHealth(true);
        try {
          const headers = { 'Content-Type': 'application/json' };
          const cleanKey = (llmConfig.api_key || '').trim();
          if (cleanKey) {
            headers['Authorization'] = `Bearer ${cleanKey}`;
          }

          const res = await fetch('http://localhost:8001/api/health', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              provider: llmConfig.provider,
              custom_base_url: llmConfig.custom_base_url || null,
              api_key: cleanKey || null,
            }),
          });
          if (res.ok) {
            const data = await res.json();
            setHealth(data);
          } else {
            setHealth({
              services: {
                fastapi: { status: 'unreachable' },
                llm: { status: 'unreachable' },
                splunk: { status: 'unreachable' },
              }
            });
          }
        } catch (e) {
          setHealth({
            services: {
              fastapi: { status: 'unreachable' },
              llm: { status: 'unreachable' },
              splunk: { status: 'unreachable' },
            }
          });
        } finally {
          setIsFetchingHealth(false);
        }
      };

      useEffect(() => {
        pollHealth();
        const interval = setInterval(pollHealth, 30000);
        return () => clearInterval(interval);
      }, [llmConfig.provider, llmConfig.custom_base_url, llmConfig.api_key]);

      const fetchAudit = async (search = '') => {
        try {
          const url = search 
            ? `http://localhost:8001/api/audit?limit=50&search=${encodeURIComponent(search)}`
            : `http://localhost:8001/api/audit?limit=50`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            setAuditData(data);
          }
        } catch (err) {
          console.error('Audit fetch error:', err);
        }
      };

      useEffect(() => {
        if (isAuditLogOpen) {
          fetchAudit(auditSearch);
        }
      }, [isAuditLogOpen, auditSearch]);

      const handleTranslate = async () => {
        if (!rawText.trim()) return;
        setIsTranslating(true);
        setTranslationError(null);
        setThreatAnalysis(null);
        setDeepLogs(deepMode ? ['Initializing autonomous Deep Mode session...'] : []);
        try {
          const res = await fetch('http://localhost:8001/api/translate-direct', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: deepMode ? 'text/event-stream, application/json' : 'application/json',
            },
            body: JSON.stringify({
              raw_text: rawText,
              llm_config: llmConfig,
              deep_mode: deepMode,
            }),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(errData.detail || 'Translation failed');
          }

          const contentType = res.headers.get('content-type') || '';
          if (contentType.includes('text/event-stream') && res.body) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let finalResult = null;

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || !trimmed.startsWith('data:')) continue;

                const dataStr = trimmed.replace(/^data:\s*/, '');
                try {
                  const parsed = JSON.parse(dataStr);
                  if (parsed.error) {
                    throw new Error(parsed.error);
                  }
                  if (parsed.result) {
                    setDeepLogs((prev) => [...prev, '> Translation Complete!']);
                    finalResult = parsed.result;
                  } else if (parsed.kql_query && parsed.spl_query) {
                    setDeepLogs((prev) => [...prev, '> Translation Complete!']);
                    finalResult = parsed;
                  } else if (parsed.status) {
                    setDeepLogs((prev) => [...prev, parsed.status]);
                  }
                } catch (e) {
                  if (e.message && !e.message.includes('JSON')) {
                    throw e;
                  }
                }
              }
            }

            if (buffer.trim().startsWith('data:')) {
              const dataStr = buffer.trim().replace(/^data:\s*/, '');
              try {
                const parsed = JSON.parse(dataStr);
                if (parsed.result) {
                  setDeepLogs((prev) => [...prev, '> Translation Complete!']);
                  finalResult = parsed.result;
                } else if (parsed.kql_query && parsed.spl_query) {
                  setDeepLogs((prev) => [...prev, '> Translation Complete!']);
                  finalResult = parsed;
                }
              } catch (e) {}
            }

            if (!finalResult) {
              throw new Error('Streaming connection closed before receiving translation payload');
            }

            setTranslationResult(finalResult);
            setSplunkQuery(finalResult.spl_query || '');
          } else {
            const data = await res.json();
            setTranslationResult(data);
            setSplunkQuery(data.spl_query || '');
          }
        } catch (err) {
          setTranslationError(err.message || 'Direct translation failed');
        } finally {
          setIsTranslating(false);
        }
      };

      const handleGenerateRunbook = async () => {
        if (!translationResult) return;
        setIsGeneratingRunbook(true);
        try {
          const p = translationResult.parsed_rule;
          const res = await fetch('http://localhost:8001/api/generate-runbook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              rule_name: p.rule_name,
              severity: p.severity,
              mitre_tactic: p.mitre_tactic,
              raw_condition: p.raw_condition,
              kql_query: translationResult.kql_query,
              spl_query: translationResult.spl_query,
              llm_config: llmConfig,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Runbook generation failed');
          setThreatAnalysis(data.threat_analysis);
        } catch (err) {
          alert(`Threat analysis failed: ${err.message}`);
        } finally {
          setIsGeneratingRunbook(false);
        }
      };

      const handleSaveAndExport = async () => {
        if (!translationResult) return;
        if (!mdeCoverage.verdict.trim()) {
          alert('Safety Boundary: Please select an MDE Coverage Verdict before exporting.');
          return;
        }

        try {
          const p = translationResult.parsed_rule;
          const res = await fetch('http://localhost:8001/api/save-runbook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              rule_name: p.rule_name,
              severity: p.severity,
              priority: p.priority,
              mitre_tactic: p.mitre_tactic,
              mitre_source: p.mitre_source,
              mitre_uri: p.mitre_uri,
              frequency_str: p.frequency.raw_frequency,
              group_by: p.group_by_fields,
              kql_query: translationResult.kql_query,
              kql_validation: translationResult.validation.kql,
              spl_query: translationResult.spl_query,
              spl_validation: translationResult.validation.spl,
              threat_analysis: threatAnalysis || {
                threat_summary: 'Pending threat runbook synthesis',
                mitre_techniques: [],
                detection_review: {
                  false_positive_sources: [],
                  evasion_blindspots: [],
                  time_window_evaluation: '',
                  missing_triage_fields: [],
                },
                analyst_triage_guide: {
                  triage_priority: p.severity,
                  initial_questions: [],
                  containment_steps: [],
                  escalation_criteria: [],
                },
                rule_naming_suggestions: [p.rule_name],
              },
              mde_coverage: mdeCoverage,
              llm_model: llmConfig.model_name || 'qwen2.5-coder',
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Save failed');
          setSavedRunbook(data);
          setIsExportOpen(true);
        } catch (err) {
          alert(`Save error: ${err.message}`);
        }
      };

      const copyToClipboard = (text, type) => {
        navigator.clipboard.writeText(text);
        if (type === 'kql') {
          setCopiedKql(true);
          setTimeout(() => setCopiedKql(false), 2000);
        } else {
          setCopiedSpl(true);
          setTimeout(() => setCopiedSpl(false), 2000);
        }
      };

      const handleTestSplunk = async () => {
        setSplunkRunning(true);
        setSplunkError(null);
        setSplunkResult(null);
        try {
          const res = await fetch('http://localhost:8001/api/test-splunk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              spl_query: splunkQuery,
              earliest_time: '-24h',
              latest_time: 'now',
              max_events: 25,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Splunk search failed');
          setSplunkResult(data);
        } catch (err) {
          setSplunkError(err.message);
        } finally {
          setSplunkRunning(false);
        }
      };

      const apiStatus = health?.services?.fastapi?.status;
      const llmStatus = health?.services?.llm?.status;
      const splunkStatus = health?.services?.splunk?.status;

      return (
        <div className="min-h-screen bg-[#07080b] bg-[radial-gradient(ellipse_80%_60%_at_50%_-10%,rgba(56,189,248,0.04),transparent)] text-slate-200 flex flex-col font-sans antialiased">
          {/* Header Bar */}
          <header className="border-b border-white/[0.06] bg-[#07080b]/80 backdrop-blur-xl sticky top-0 z-40 px-4 sm:px-6 lg:px-8 py-3.5">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 max-w-7xl mx-auto w-full">
              <div className="flex items-center gap-3.5">
                <div className="w-9 h-9 rounded-xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-cyan-400 shadow-sm">
                  <ShieldIcon className="w-4 h-4" />
                </div>
                <div>
                  <div className="flex items-center gap-2.5">
                    <h1 className="text-sm font-semibold tracking-tight text-white">
                      ArcSight Migration Suite
                    </h1>
                    <span className="px-2 py-0.5 text-[10px] font-medium uppercase tracking-wider rounded-full bg-cyan-400/10 text-cyan-300 border border-cyan-400/20">
                      Direct Path

                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-indigo-500/20 pb-4">
                    <div className="flex items-start sm:items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shrink-0">
                        <UserCheckIcon className="w-4 h-4" />
                      </div>
                      <div>
                        <div className="flex items-center gap-2.5">
                          <h3 className="text-sm font-semibold text-white tracking-tight">
                            Microsoft Defender (MDE) Native Coverage Assessment
                          </h3>
                          <span className="px-2 py-0.5 text-[10px] font-medium uppercase tracking-wider rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/30">
                            Human-in-the-Loop
                          </span>
                        </div>
                        <p className="text-xs text-indigo-200/70 font-light mt-0.5">
                          Strict Safety Boundary: Zero LLM generation permitted. Review must be entered by an engineer.
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5 text-xs sm:text-sm">
                    <div className="md:col-span-2 space-y-1.5">
                      <label className="block text-xs font-medium text-zinc-300">
                        Coverage Verdict <span className="text-rose-400">*</span>
                      </label>
                      <select
                        value={mdeCoverage.verdict}
                        onChange={(e) => setMdeCoverage({ ...mdeCoverage, verdict: e.target.value })}
                        className="w-full bg-[#07080b]/90 border border-white/[0.08] focus:border-indigo-400/50 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-zinc-200 focus:outline-none transition-all"
                      >
                        <option value="">Select Human-Verified Verdict...</option>
                        <option value="Native MDE Alert Exists (No Custom Rule Required)">
                          Native MDE Alert Exists (No Custom Rule Required)
                        </option>
                        <option value="Partial / Custom KQL Rule Required (Complementary)">
                          Partial / Custom KQL Rule Required (Complementary)
                        </option>
                        <option value="No Native Coverage (Custom KQL Rule Mandatory)">
                          No Native Coverage (Custom KQL Rule Mandatory)
                        </option>
                        <option value="Under Evaluation / Pending Lab Verification">
                          Under Evaluation / Pending Lab Verification
                        </option>
                      </select>
                    </div>

                    <div className="space-y-1.5">
                      <label className="block text-xs font-medium text-zinc-300">Assessing Engineer</label>
                      <input
                        type="text"
                        value={mdeCoverage.reviewer_name}
                        onChange={(e) => setMdeCoverage({ ...mdeCoverage, reviewer_name: e.target.value })}
                        className="w-full bg-[#07080b]/90 border border-white/[0.08] focus:border-indigo-400/50 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-zinc-200 focus:outline-none transition-all"
                      />
                    </div>

                    <div className="md:col-span-3 space-y-1.5">
                      <label className="block text-xs font-medium text-zinc-300">Analyst Justification Notes</label>
                      <textarea
                        rows={3}
                        value={mdeCoverage.notes}
                        onChange={(e) => setMdeCoverage({ ...mdeCoverage, notes: e.target.value })}
                        placeholder="Document reasons why default alerts do or do not cover this technique..."
                        className="w-full bg-[#07080b]/90 border border-white/[0.08] focus:border-indigo-400/50 rounded-xl p-3.5 text-xs sm:text-sm leading-relaxed text-zinc-200 font-mono focus:outline-none transition-all"
                      />
                    </div>
                  </div>
                </div>

                {/* Final Git Export Action Strip */}
                <div className="rounded-2xl border border-white/[0.08] bg-[#0c0d14]/90 backdrop-blur-md p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                  <div className="space-y-1">
                    <h3 className="text-base font-semibold text-white tracking-tight">Final Detection Engineering Runbook</h3>
                    <p className="text-xs text-zinc-400 font-light">
                      Merges parsed metadata, validated queries, AI threat playbook, and human MDE verdict.
                    </p>
                  </div>
                  <button
                    onClick={handleSaveAndExport}
                    disabled={!mdeCoverage.verdict.trim()}
                    className="flex items-center justify-center gap-2.5 px-6 py-3 rounded-xl bg-white hover:bg-zinc-100 disabled:opacity-30 text-[#07080b] font-semibold text-xs sm:text-sm shadow-[0_0_20px_rgba(255,255,255,0.1)] transition-all cursor-pointer shrink-0"
                  >
                    <DownloadIcon className="w-4 h-4" />
                    <span>Save &amp; Export Git-Ready .txt</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Model Selector Modal */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/75 backdrop-blur-md animate-fadeIn">
              <div className="w-full max-w-lg rounded-2xl border border-white/[0.1] bg-[#0c0d14]/95 p-6 sm:p-8 space-y-6 text-sm shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/[0.06] pb-4">
                  <div className="flex items-center gap-2.5 text-cyan-400">
                    <CpuIcon className="w-5 h-5" />
                    <h3 className="text-sm font-semibold text-white tracking-tight">Dual-Model Routing Configuration</h3>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="p-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors" title="Close">
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>
                <div className="space-y-4">
                  <div className="space-y-1.5">
                    <label className="block text-xs font-medium text-zinc-300">Provider</label>
                    <select
                      value={llmConfig.provider}
                      onChange={(e) => setLlmConfig({ ...llmConfig, provider: e.target.value })}
                      className="w-full bg-[#07080b] border border-white/[0.08] rounded-xl px-4 py-2.5 text-xs text-zinc-200"
                    >
                      <option value="lm_studio">LM Studio (Local / Zero Cloud Leak)</option>
                      <option value="cloud_openai">Cloud OpenAI API</option>
                      <option value="cloud_custom">Custom Endpoint</option>
                    </select>
                  </div>
                  <div className="space-y-1.5">
                    <label className="block text-xs font-medium text-zinc-300">Base URL</label>
                    <input
                      type="text"
                      value={llmConfig.custom_base_url}
                      onChange={(e) => setLlmConfig({ ...llmConfig, custom_base_url: e.target.value })}
                      className="w-full bg-[#07080b] border border-white/[0.08] rounded-xl px-4 py-2.5 text-xs text-zinc-200 font-mono"
                    />
                  </div>
                  <div className="space-y-1.5">
                    <label className="block text-xs font-medium text-zinc-300">Model Name</label>
                    <input
                      type="text"
                      value={llmConfig.model_name}
                      onChange={(e) => setLlmConfig({ ...llmConfig, model_name: e.target.value })}
                      className="w-full bg-[#07080b] border border-white/[0.08] rounded-xl px-4 py-2.5 text-xs text-zinc-200 font-mono"
                    />
                  </div>
                </div>
                <div className="flex justify-end pt-3 border-t border-white/[0.06]">
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="px-5 py-2.5 bg-cyan-400 hover:bg-cyan-300 text-[#07080b] font-semibold rounded-xl text-xs transition-all shadow-[0_0_15px_rgba(34,211,238,0.2)]"
                  >
                    Apply Configuration
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Audit Log Modal */}
          {isAuditLogOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/75 backdrop-blur-md animate-fadeIn">
              <div className="w-full max-w-4xl rounded-2xl border border-white/[0.1] bg-[#0c0d14]/95 p-6 sm:p-8 space-y-5 max-h-[90vh] flex flex-col shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/[0.06] pb-4">
                  <div className="flex items-center gap-2.5 text-cyan-400">
                    <HistoryIcon className="w-5 h-5" />
                    <h3 className="text-sm font-semibold text-white tracking-tight">Audit Log History</h3>
                  </div>
                  <button onClick={() => setIsAuditLogOpen(false)} className="p-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors" title="Close">
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>

                <div className="relative">
                  <SearchIcon className="w-3.5 h-3.5 text-zinc-500 absolute left-3.5 top-3" />
                  <input
                    type="text"
                    value={auditSearch}
                    onChange={(e) => setAuditSearch(e.target.value)}
                    placeholder="Filter audit entries by rule name..."
                    className="w-full bg-[#07080b] border border-white/[0.08] rounded-xl pl-9 pr-4 py-2 text-xs text-zinc-200 focus:outline-none focus:border-cyan-400/50"
                  />
                </div>

                <div className="flex-1 overflow-y-auto rounded-xl border border-white/[0.06] bg-[#07080b] text-xs">
                  <table className="w-full text-left">
                    <thead className="border-b border-white/[0.06] bg-white/[0.02] text-zinc-400 font-medium sticky top-0">
                      <tr>
                        <th className="px-4 py-3">Timestamp</th>
                        <th className="px-4 py-3">Rule</th>
                        <th className="px-4 py-3">Coverage</th>
                        <th className="px-4 py-3">Outcome</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/[0.04]">
                      {auditData?.history?.map((item) => (
                        <tr key={item.id} className="hover:bg-white/[0.02]">
                          <td className="px-4 py-2.5 text-zinc-500 font-mono">{item.timestamp ? item.timestamp.replace('T', ' ').slice(0, 19) : ''}</td>
                          <td className="px-4 py-2.5 text-zinc-200 font-medium">{item.rule_name}</td>
                          <td className="px-4 py-2.5 font-mono">{item.coverage_pct !== null ? `${item.coverage_pct}%` : '-'}</td>
                          <td className="px-4 py-2.5">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-medium uppercase border ${
                              item.outcome === 'passed' || item.outcome === 'success' ? 'border-emerald-500/30 text-emerald-300' : 'border-rose-500/30 text-rose-300'
                            }`}>
                              {item.outcome}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Splunk Test Modal */}
          {isSplunkModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/75 backdrop-blur-md animate-fadeIn">
              <div className="w-full max-w-2xl rounded-2xl border border-white/[0.1] bg-[#0c0d14]/95 p-6 sm:p-8 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/[0.06] pb-3">
                  <div className="flex items-center gap-2 text-emerald-400">
                    <DatabaseIcon className="w-5 h-5" />
                    <h3 className="text-sm font-semibold text-white">Live Splunk Validation (Read-Only)</h3>
                  </div>
                  <button onClick={() => setIsSplunkModalOpen(false)} className="p-1 text-zinc-400 hover:text-white" title="Close">
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>
                <div className="space-y-3 text-xs">
                  <textarea
                    rows={4}
                    value={splunkQuery}
                    onChange={(e) => setSplunkQuery(e.target.value)}
                    className="w-full bg-[#07080b] border border-white/[0.08] rounded-xl p-3.5 font-mono text-xs text-zinc-200 focus:outline-none focus:border-cyan-400/50"
                  />
                  <div className="flex justify-end">
                    <button
                      onClick={handleTestSplunk}
                      disabled={splunkRunning || !splunkQuery.trim()}
                      className="flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-[#07080b] font-semibold text-xs transition-all shadow-[0_0_15px_rgba(52,211,153,0.2)]"
                    >
                      <PlayIcon className={`w-3.5 h-3.5 ${splunkRunning ? 'animate-spin' : ''}`} />
                      <span>{splunkRunning ? 'Executing...' : 'Run Search'}</span>
                    </button>
                  </div>
                  {splunkError && (
                    <div className="p-3 rounded-xl border border-rose-500/30 bg-rose-500/[0.06] text-rose-300 text-xs">
                      Error: {splunkError}
                    </div>
                  )}
                  {splunkResult && (
                    <div className="p-3 rounded-xl border border-white/[0.06] bg-[#07080b] space-y-1.5 text-xs">
                      <div className="text-emerald-300 font-medium">Search Complete • {splunkResult.hit_count} hits</div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Export Viewer Modal */}
          {isExportOpen && savedRunbook && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="w-full max-w-4xl rounded-2xl border border-white/[0.1] bg-[#0c0d14]/95 p-6 sm:p-8 space-y-5 max-h-[90vh] flex flex-col text-sm shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/[0.06] pb-4">
                  <div className="flex items-center gap-2 text-cyan-400">
                    <FileCodeIcon className="w-5 h-5" />
                    <div>
                      <h3 className="text-sm font-semibold text-white tracking-tight">Git-Ready Output Specification</h3>
                      <p className="text-xs text-zinc-400 font-mono mt-0.5">{savedRunbook.filename}</p>
                    </div>
                  </div>
                  <button onClick={() => setIsExportOpen(false)} className="p-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors" title="Close">
                    <XIcon className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-[#07080b] p-3.5 rounded-xl border border-white/[0.06]">
                  <span className="text-xs text-zinc-400 font-mono">Target: <code className="text-cyan-300">{savedRunbook.file_path}</code></span>
                  <button
                    onClick={() => {
                      const blob = new Blob([savedRunbook.content], { type: 'text/plain;charset=utf-8' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = savedRunbook.filename;
                      a.click();
                    }}
                    className="flex items-center gap-1.5 px-4 py-1.5 bg-cyan-400 hover:bg-cyan-300 text-[#07080b] font-semibold rounded-xl text-xs transition-all shadow-[0_0_15px_rgba(34,211,238,0.2)] shrink-0"
                  >
                    <DownloadIcon className="w-3.5 h-3.5" />
                    <span>Download .txt</span>
                  </button>
                </div>
                <pre className="flex-1 overflow-y-auto bg-[#07080b] p-5 rounded-xl border border-white/[0.06] font-mono text-xs text-zinc-200 leading-relaxed whitespace-pre-wrap select-all">
                  {savedRunbook.content}
                </pre>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

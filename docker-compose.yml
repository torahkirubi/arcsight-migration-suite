services:
  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
    ports:
      - "8000:8000"
      - "8089:8089"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - LM_STUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - DEFAULT_LLM_MODEL=qwen2.5-coder-7b-instruct
      - SPLUNK_HOST=https://splunk:8089
      - SPLUNK_USER=admin
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
      - AUDIT_DB_PATH=/app/backend/data/audit_history.db
      - VAULT_DB_PATH=/app/backend/data/vault.db
      - GIT_READY_OUTPUT_DIR=/app/backend/git_ready_output
      # LLM Providers (overrideable via .env)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Microsoft Sentinel / Log Analytics (overrideable via .env)
      - SENTINEL_WORKSPACE_ID=${SENTINEL_WORKSPACE_ID}
      - AZURE_WORKSPACE_ID=${AZURE_WORKSPACE_ID}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      # Azure Monitor Logs Ingestion / DCE / DCR
      - AZURE_LOG_INGEST_CLIENT_ID=${AZURE_LOG_INGEST_CLIENT_ID}
      - AZURE_LOG_INGEST_SECRET=${AZURE_LOG_INGEST_SECRET}
      - DCE_INGESTION_ENDPOINT=${DCE_INGESTION_ENDPOINT}
      - DCR_IMMUTABLE_ID=${DCR_IMMUTABLE_ID}
      - CUSTOM_STREAM_NAME=${CUSTOM_STREAM_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./git_ready_output:/app/backend/git_ready_output
      - vault_data:/app/backend/data
    depends_on:
      - splunk
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vault_data:
